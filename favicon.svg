<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2223" />
      <stop offset="50%" stop-color="#151718" />
      <stop offset="100%" stop-color="#0D0E0F" />
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(255,255,255,0.015)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Base Solid Square Frame -->
  <rect width="512" height="512" fill="url(#cyberBg)" />
  <rect width="512" height="512" fill="url(#grid)" />

  <!-- Outer Technical Framing -->
  <rect x="20" y="20" width="472" height="472" fill="none" stroke="#2B3032" stroke-width="2" />
  <rect x="28" y="28" width="456" height="456" fill="none" stroke="rgba(248, 245, 70, 0.15)" stroke-width="1" />

  <!-- Mechanical Corner Brackets -->
  <!-- Top Left: Cyber Yellow Accent -->
  <path d="M 20 72 L 20 20 L 72 20" fill="none" stroke="#F8F546" stroke-width="6" stroke-linecap="square" />
  <!-- Top Right: Graphite Mid -->
  <path d="M 440 20 L 492 20 L 492 72" fill="none" stroke="#5A5D5B" stroke-width="4" stroke-linecap="square" />
  <!-- Bottom Left: Graphite Mid -->
  <path d="M 20 440 L 20 492 L 72 492" fill="none" stroke="#5A5D5B" stroke-width="4" stroke-linecap="square" />
  <!-- Bottom Right: Cyber Yellow Accent -->
  <path d="M 440 492 L 492 492 L 492 440" fill="none" stroke="#F8F546" stroke-width="6" stroke-linecap="square" />

  <!-- Top-Left Hazard Chamfer Notch -->
  <polygon points="20,20 52,20 20,52" fill="#F8F546" />

  <!-- Letter 'S' - Industrial Monospace Heavyweight (Pure White) -->
  <path d="
    M 76 144
    H 196
    V 196
    H 128
    V 230
    H 196
    V 368
    H 76
    V 316
    H 144
    V 282
    H 76
    Z
  " fill="#FFFFFF" />

  <!-- Letter 'H' - Industrial Monospace Heavyweight (Cyber Yellow #F8F546) -->
  <path d="
    M 232 144
    H 284
    V 230
    H 336
    V 144
    H 388
    V 368
    H 336
    V 282
    H 284
    V 368
    H 232
    Z
  " fill="#F8F546" />

  <!-- Signature Cyber Accent Dot (SH.) -->
  <rect x="404" y="336" width="32" height="32" fill="#F8F546" />
  <polygon points="424,336 436,336 436,348" fill="#151718" />
</svg>